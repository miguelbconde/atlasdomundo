name: Android — gerar AAB para a Play Store

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências e copiar o site para o app
        run: |
          npm ci
          npx cap sync android

      - name: Recuperar a chave de assinatura (upload key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Compilar o pacote (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-do-mundo-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Envio automático para o teste interno da Play Store.
      # Só funciona depois do PRIMEIRO envio manual pelo site da Play Console
      # e com o segredo PLAY_SERVICE_ACCOUNT_JSON configurado.
      - name: Enviar para a Play Store (teste interno)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.miguelbconde.atlasdomundo
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
