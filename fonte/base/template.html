<!DOCTYPE html>
<html lang="pt-BR" data-mode="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6">
<!--__PWA__-->
<title>Atlas do Mundo · enciclopédia ilustrada</title>
<style>
/*__FONTS__*/
/* VOICE: uma enciclopédia de verdade para leitores de 6 a 9 anos (e seus adultos): clara, precisa, sem infantilizar.
   IDEA: o mundo visto do Sul — o Brasil como ponto de partida, mapa que pode virar "sul em cima", câmbio a partir do real.
   PICTURE: o mapa do mundo por regiões, as fichas de países textos próprios, fotos livres do Wikimedia Commons e mapas desenhados de cada país.
   COLOUR and TYPE: papel claro, tinta escura, fios finos; uma paleta terrosa por região; Literata nos títulos, Figtree no texto.
   LAYOUT: artigo de enciclopédia com quadro-resumo lateral; listas e tabelas sóbrias; abas embaixo no celular. */
:root{
  --serif:'Literata',Georgia,'Times New Roman',serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#fbfaf6;--paper:#ffffff;--bg2:#f2efe8;--ink:#1f2328;--ink2:#4d535b;--ink3:#7c828a;--line:#e3ded3;--line2:#cfc8b9;--link:#1f5f8b;
  --sea:#d6e8ef;--seaink:#3a6a86;--sea2:#bcd8e3;--grat:rgba(70,110,130,.13);
  --as:#3c8d5a;--ac:#d2693c;--an:#b8902a;--eu:#5677ad;--af:#c27c2c;--ai:#b8433c;--oc:#2b9493;--aq:#9fb3c4;
  --ok:#2f8f4e;--bad:#b8433c;color-scheme:light;
}
[data-mode=escuro]{--bg:#15181c;--paper:#1c2026;--bg2:#232830;--ink:#eceae4;--ink2:#c3c6cc;--ink3:#8d939b;--line:#2e343c;--line2:#3d444e;--link:#8cc3e8;--sea:#1b2d38;--seaink:#8fb8cf;--sea2:#24404f;--grat:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--sans);overflow-x:clip;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.005em}
.bands{height:4px;display:flex}.bands i{flex:1}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto;padding:10px 18px}
.logo{display:flex;align-items:baseline;gap:10px;color:var(--ink);margin-right:auto}
.logo:hover{text-decoration:none}
.logo b{font:600 23px/1 var(--serif)}
.logo small{font:500 12.5px/1 var(--sans);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.ib{width:40px;height:40px;border:1px solid var(--line2);background:var(--paper);border-radius:6px;display:grid;place-items:center;flex:none}
.ib svg{width:21px;height:21px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.off svg .w{display:none}.ib:not(.off) svg .x{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav.tabs a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;color:var(--ink3);font:600 12px var(--sans);border-top:2px solid transparent}
nav.tabs a:hover{text-decoration:none;color:var(--ink)}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:10px 18px 40px}
.loading{padding:60px 0;text-align:center;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:6px;background:var(--paper);font:600 15.5px var(--sans);color:var(--ink)}
.btn:hover{border-color:var(--ink3);text-decoration:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;flex:none}
.seg button,.seg a{border:0;background:var(--paper);padding:7px 12px;font:600 14px var(--sans);color:var(--ink2);border-right:1px solid var(--line)}
.seg>*:last-child{border-right:0}
.seg [aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:4px;padding:5px 10px;font:600 14.5px var(--sans);color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{text-decoration:none;border-color:var(--ink3)}
.chip i{width:10px;height:10px;border-radius:2px;flex:none}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.pagehead h1{font-size:clamp(30px,4.5vw,42px)}
.pagehead p{margin:4px 0 0;color:var(--ink2);max-width:46em}
.kick{font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* mapa */
.mapbox{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sea);height:min(68vh,640px)}
.mapbox.mini{height:200px}
.mapbox.game{height:min(56vh,540px)}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox .grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.cty{stroke:var(--paper);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;opacity:.82}
.cty:hover{opacity:1}
.cty.me{opacity:1;stroke:var(--ink);stroke-width:1.6}
svg.focus .cty:not(.me){opacity:.35}
.cty.hi{opacity:1;stroke:var(--ink);stroke-width:1.6}
.dot{stroke:var(--paper);vector-effect:non-scaling-stroke;stroke-width:.8;cursor:pointer;opacity:.85}
.lab{font-family:var(--sans);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:color-mix(in srgb,var(--paper) 85%,transparent);stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.ref{fill:none;stroke:var(--ink2);stroke-width:.7;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.35;pointer-events:none}
.ref.eq{stroke-dasharray:none;opacity:.4}
.rlab{font-family:var(--sans);font-style:italic;fill:var(--ink2);opacity:.6;pointer-events:none;text-anchor:middle}
.olab{font-family:var(--serif);font-style:italic;fill:var(--seaink,#3d6f8f);opacity:.75;pointer-events:none;text-anchor:middle;letter-spacing:.22em}
.clab{font-family:var(--sans);font-weight:700;fill:#fff;opacity:.92;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:.6px;pointer-events:none;text-anchor:middle;letter-spacing:.16em}
.mctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14.5px;color:var(--ink3)}

/* listas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 16px}
.fc{display:flex;gap:10px;align-items:center;color:var(--ink);padding:6px 0;border-bottom:1px solid var(--line)}
.fc:hover{text-decoration:none}.fc:hover b{text-decoration:underline}
.fc img{width:44px;flex:none}
.fc b{font:600 16px/1.2 var(--sans);display:block}
.fc small{color:var(--ink3);font-size:13.5px}
.flag{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.12);background:#fff}
.ghead{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:18px 0 2px;font:600 21px var(--serif)}
.ghead i{width:12px;height:12px;border-radius:2px}
.search{position:relative;margin:4px 0 8px;max-width:520px}
.search input{width:100%;height:46px;border-radius:6px;border:1px solid var(--line2);background:var(--paper);padding:0 14px 0 42px;font:500 17px var(--sans);color:var(--ink)}
.search input:focus{outline:2px solid var(--link);outline-offset:0}
.search svg{position:absolute;left:13px;top:13px;width:20px;height:20px;stroke:var(--ink3);fill:none;stroke-width:2}

/* artigo de país */
.art{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.ahead{grid-column:1/-1;display:flex;gap:22px;align-items:center;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.ahead .fl{width:min(200px,34vw);flex:none;display:flex;flex-direction:column;gap:8px}
.ahead{align-items:flex-start}.ahead .hm{flex:1;min-width:0}
.hino{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.3;color:var(--ink2)}
.hino .btn{flex:none;padding:6px 10px;font-size:14px}
.hino small{display:block;color:var(--ink3);font-size:12px}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:14px}
.key .stat .v{font-size:18px}.key .stat .rk{font-size:12.5px}
.tzl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr;gap:0;font-size:14px}.tzl li{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line);font-weight:400}.tzl li span{flex:1;min-width:0;overflow-wrap:anywhere}.tzl li b{font-variant-numeric:tabular-nums;font-weight:600}.tzl li small{color:var(--ink3);font-size:11px;white-space:nowrap}.tzl li.cap span{font-weight:700}
.key .clk .v{font-variant-numeric:tabular-nums}
.ahead h1{font-size:clamp(34px,5.5vw,56px)}
.ahead .sub{color:var(--ink2);margin-top:6px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.ahead .sub .tag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ahead .sub .tag i{width:10px;height:10px;border-radius:2px}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:4px 12px 4px 8px;font:500 15px var(--sans);color:var(--ink)}
.speak svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.speak.on svg{stroke:var(--link)}
.body section{padding:18px 0;border-bottom:1px solid var(--line)}
.body section:last-child{border-bottom:0}
.body h2{font-size:25px;margin-bottom:8px}
.body h3{font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px}
.body p{margin:0 0 .6em;max-width:44em}
.lst{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.lst li{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:3px 9px;font-size:16px}
.plst{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plst li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 10px 6px 6px;font-size:15.5px;line-height:1.25}
.plst img{width:40px;height:40px;flex:none;background:var(--bg2);border-radius:3px;padding:3px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dish{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;border-top:3px solid var(--c);padding-top:10px}
.dish img{width:64px;height:64px;background:var(--bg2);border-radius:4px;padding:6px}
.dish b{font:600 19px var(--serif);display:block}
.dish span{color:var(--ink2);font-size:16px}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:4px}
.ex{border:1px solid var(--line);border-left:3px solid var(--c,var(--ink3));background:var(--paper);border-radius:4px;padding:12px 14px}
.ex .ty{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ex .or{display:flex;gap:8px;align-items:center;font:600 21px/1.25 var(--serif);margin:4px 0 2px}
.ex .or button{border:1px solid var(--line2);background:none;border-radius:999px;width:30px;height:30px;display:inline-grid;place-items:center;flex:none;cursor:pointer}
.ex .or button svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:2}
.ex .or button.on svg{stroke:var(--link)}
.ex .rm{color:var(--ink3);font-size:14px}
.ex .li{font-style:italic;color:var(--ink2);font-size:15px;margin-top:4px}
.ex .se{margin-top:6px;font-size:16px;line-height:1.45}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.word{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 12px}
.word:hover{border-color:var(--ink3)}
.word .pt{font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:flex;gap:6px;align-items:center}
.word .pt svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2}
.word .fx{font:600 22px/1.2 var(--serif)}
.word .pr{font-size:14.5px;color:var(--ink2)}
.word.on{border-color:var(--link)}
.cur{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.cur div{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 12px}
.cur b{font:600 20px var(--serif);display:block}
.cur small{color:var(--ink3);font-size:13.5px}
.conv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.conv input{width:120px;height:40px;border:1px solid var(--line2);border-radius:4px;padding:0 10px;font:600 17px var(--sans);background:var(--paper);color:var(--ink)}
.conv output{font:600 18px var(--serif)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stat{background:var(--paper);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.stat:hover{text-decoration:none;background:var(--bg2)}
.stat .l{font:700 11.5px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.stat .v{font:600 20px/1.2 var(--serif)}
.stat .rk{font-size:13.5px;color:var(--ink2)}
.stat .rk b{color:var(--c)}
.src{font-size:13.5px;color:var(--ink3);margin-top:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 20px}
figure.ph{margin:0}
figure.ph img{display:block;width:100%;height:auto;cursor:zoom-in;background:var(--bg2)}
figure.ph figcaption{font-size:15px;color:var(--ink2);margin-top:6px;line-height:1.45}
figure.ph figcaption b{display:block;font:700 12.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.note{border-left:3px solid var(--line2);padding:2px 0 2px 12px;margin:0 0 14px;font-size:15.5px;color:var(--ink2);break-inside:avoid}
.note b{font:700 12.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;display:block}
.edit{background:var(--bg2);border-left:3px solid var(--link);padding:8px 12px;font-size:15px;color:var(--ink2);margin:8px 0}
.nbs{display:flex;flex-wrap:wrap;gap:6px 14px}
.nbs a{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:16px}
.nbs img{width:26px}
aside.box{position:sticky;top:76px;border:1px solid var(--line);background:var(--paper)}
aside.box .t{padding:10px 14px;border-bottom:1px solid var(--line);font:600 17px var(--serif)}
aside.box .mapbox{border:0;border-bottom:1px solid var(--line);border-radius:0}
dl.facts{margin:0;padding:4px 14px 10px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15.5px}
dl.facts dt{color:var(--ink3);font-size:13.5px;padding-top:2px}
dl.facts dd{margin:0;font-weight:600}
.photocr{font-size:13px;color:var(--ink2);padding-left:22px;columns:2 360px;column-gap:28px}.photocr li{break-inside:avoid;margin-bottom:6px}.photocr span{color:var(--ink3);word-break:break-all;font-size:12px}
.cr{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px}.cr a{color:inherit}
.hmap{margin:0}.hmap img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;margin:0 auto;border:1px solid var(--line);cursor:zoom-in;background:#f4ecd8}
.hleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--ink2)}.hleg span{display:inline-flex;align-items:center;gap:6px}.hleg i{width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,.15);flex:none}
.anth{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.anth small{display:block;color:var(--ink3);font-size:13.5px}

/* regiões */
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 22px}
.reg{display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.reg:hover{text-decoration:none}.reg:hover b{text-decoration:underline}
.reg img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--bg2)}
.reg .ph0{width:100%;aspect-ratio:3/2;background:var(--bg2)}
.reg b{font:600 20px/1.2 var(--serif)}
.reg small{color:var(--ink3);font-size:14px}
.lede{font:400 20px/1.6 var(--serif);max-width:40em;margin:8px 0 14px}
.lede::first-letter{font-size:1.15em}
.flagrow{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 18px}
.flagrow a{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:15.5px}
.flagrow img{width:28px}

/* números */
.rank{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:40px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
.rrow:hover{text-decoration:none;background:var(--bg2)}
.rrow.me{background:color-mix(in srgb,var(--as) 10%,transparent)}
.rrow .n{font:600 16px var(--serif);color:var(--ink3);text-align:right}
.rrow img{width:34px}
.rrow>span{display:block}
.rrow b{font:600 16px/1.2 var(--sans);display:block}
.rrow .tr{display:block;height:6px;background:var(--bg2);margin-top:5px}
.rrow .tr i{display:block;height:100%}
.rrow .val{font:600 15.5px var(--sans);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* jogos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{border:1px solid var(--line);background:var(--paper);padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.gcard:hover{text-decoration:none;border-color:var(--ink3)}
.gcard b{font:600 21px var(--serif)}
.gcard span{color:var(--ink2);font-size:16px}
.qwrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:10px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink3);font-weight:600}
.qflag{width:min(320px,76vw);margin:0 auto}
.qq{text-align:center;font:600 24px/1.25 var(--serif)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;border:1px solid var(--line2);border-radius:4px;padding:6px 14px 6px 6px;background:var(--paper);font:600 19px var(--sans);text-align:left}
.opt:hover{border-color:var(--ink3)}
.opt .spk{width:40px;height:40px;border:0;background:var(--bg2);border-radius:4px;display:grid;place-items:center;flex:none}

    const play = () => say(g[1].replace(/[!¡！]/g, ''), t.gv || g[0]); setTimeout(play, 300); $('#hear').onclick = play;
    $$('.opt', main).forEach(b => b.onclick = () => { if (main.dataset.lock) return; lock(); const good = BYK[b.dataset.k].g === t.g; b.classList.add(good ? 'ok' : 'no'); if (!good) $(`.opt[data-k="${t.k}"]`, main).classList.add('ok'); toast(`“${g[1]}”: ${t.lg[0]}`); mark(good); });
  }

}

/* imagem ampliada */
const lb = $('#lb'), lbi = $('img', lb), stage = $('.stage', lb); let L = {s: 1, x: 0, y: 0};
const lbA = () => lbi.style.transform = `translate(${L.x}px,${L.y}px) scale(${L.s})`;
function lbFit() { const W = innerWidth, H = innerHeight - 120, w = lbi.naturalWidth, h = lbi.naturalHeight; L.s = Math.min(W / w, H / h, 2.5) * .95; L.x = (W - w * L.s) / 2; L.y = (H - h * L.s) / 2 + 10; lbA(); }
function lbZ(f, cx, cy) { const ns = Math.max(.1, Math.min(6, L.s * f)); f = ns / L.s; L.x = cx - (cx - L.x) * f; L.y = cy - (cy - L.y) * f; L.s = ns; lbA(); }
function openLB(src, cap) { lbi.onload = lbFit; lbi.src = src; $('.cap', lb).innerHTML = cap || ''; lb.classList.add('on'); document.body.style.overflow = 'hidden'; history.pushState({lb: 1}, ''); }
function closeLB(fromPop) { if (!lb.classList.contains('on')) return; lb.classList.remove('on'); document.body.style.overflow = ''; if (!fromPop && history.state && history.state.lb) history.back(); }
addEventListener('popstate', () => closeLB(true));
$('.x', lb).onclick = () => closeLB();
stage.addEventListener('wheel', e => { e.preventDefault(); lbZ(Math.exp(-e.deltaY * .0018), e.clientX, e.clientY); }, {passive: false});
const LP = new Map(); let lpin = null, lmv = 0;
stage.addEventListener('pointerdown', e => { LP.set(e.pointerId, [e.clientX, e.clientY]); stage.setPointerCapture(e.pointerId); lmv = 0; if (LP.size === 2) { const [a, b] = [...LP.values()]; lpin = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
stage.addEventListener('pointermove', e => { if (!LP.has(e.pointerId)) return; const p = LP.get(e.pointerId); LP.set(e.pointerId, [e.clientX, e.clientY]); if (LP.size === 2) { const [a, b] = [...LP.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (lpin) lbZ(d / lpin, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); lpin = d; lmv += 20; return; } L.x += e.clientX - p[0]; L.y += e.clientY - p[1]; lmv += Math.abs(e.clientX - p[0]) + Math.abs(e.clientY - p[1]); lbA(); });
stage.addEventListener('pointerup', e => { LP.delete(e.pointerId); if (LP.size < 2) lpin = null; if (lmv < 6 && e.target === stage) closeLB(); });
document.addEventListener('keydown', e => { if (lb.classList.contains('on') && e.key === 'Escape') closeLB(); });
addEventListener('resize', () => { if (lb.classList.contains('on')) lbFit(); });
